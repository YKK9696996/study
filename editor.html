<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教材编辑</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><script src="content.js" defer></script><script src="monet-content.js" defer></script><script src="van-gogh-content.js" defer></script><script src="layout.js" defer></script><script src="editor.js" defer></script></head><body><header class="topbar"><a class="brand" href="./">画風学習室<span>教材编辑</span></a><span class="status">研究者用</span></header><main class="editor"><div class="editor-header"><div><p class="eyebrow">MATERIAL EDITOR</p><h1>编辑学习材料</h1></div><div><a id="draft-control-preview" href="./?preview=1&amp;group=control" target="_blank" rel="noopener">预览对照组</a> · <a id="draft-preview" href="./?preview=1" target="_blank" rel="noopener">预览实验组</a></div></div><p>修改文字、添加图片，然后保存并预览。草稿只保存在当前浏览器；导出教材文件并替换网站中对应的教材文件 后，重新发布才会更新参与者看到的版本。</p><nav aria-label="切换画家"><a href="?artist=monet">编辑莫奈</a> · <a href="?artist=van-gogh">编辑梵高</a></nav><form id="settings"><div class="editor-grid"><label>教材标题<input id="edit-title" required></label><label>学习时长（秒）<input id="edit-duration" type="number" min="1" max="7200" required></label><label>教材版本<input id="edit-version" required></label><label>研究编号<input id="edit-study" required></label><label>对照组后测链接<input id="edit-control" type="url" placeholder="https://docs.google.com/forms/…"></label><label>实验组后测链接<input id="edit-experimental" type="url" placeholder="https://docs.google.com/forms/…"></label></div><label>开始前说明<textarea id="edit-intro"></textarea></label></form><div class="editor-toolbar"><button id="save-draft">保存草稿并预览</button><button id="export" class="secondary">导出教材文件</button><button id="export-settings" class="secondary">导出共用设置</button><button id="import-button" class="secondary">导入教材文件</button><input id="import-file" type="file" accept=".js,.json" hidden></div><p id="editor-status" class="editor-alert" role="status"></p><div id="edit-sections"></div><button id="add-triptych" class="secondary">添加三图组（实验组）</button> <button id="add-section" class="secondary">添加章节</button><details><summary>参与者入口与版本说明</summary><p>对照组：index.html?group=control<br>实验组：index.html?group=experimental<br>保存草稿不会改变计时。修改版本号会建立新的学习记录；正式收集期间请勿随意修改。当前网页不向研究者上传参与者计时记录。</p></details></main><footer>原文件保留不变</footer></body></html>
