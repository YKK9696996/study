<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画風学習</title><meta name="description" content="作品と解説を見ながら画風を学ぶ電子教材。"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><script src="content.js" defer></script><script src="monet-content.js" defer></script><script src="van-gogh-content.js" defer></script><script src="layout.js" defer></script><script src="app.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="./">画風学習<span>LEARNING MATERIALS</span></a><nav id="top-artist-nav" class="artist-nav top-artist-nav" aria-label="画家を切り替える（ヘッダー）" hidden></nav><div id="status" class="status">学習の準備</div></header>
<main><section id="welcome" class="welcome"><p class="eyebrow">画風を観察する</p><h1 id="title">画風学習</h1><p id="intro"></p><div class="facts"><span>学習時間 <strong id="duration">5分</strong></span><span>画像は拡大できます</span></div><form id="start-form"><label for="participant">参加者番号</label><input id="participant" name="participant" autocomplete="off" maxlength="64" required placeholder="指定された番号を入力"><p class="hint">パソコンでご参加ください。学習後は教材を閉じて、テストにお進みください。</p><p id="load-status" role="status">画像を読み込んでいます…</p><button id="start" disabled>学習を始める</button></form><p id="start-error" role="alert"></p></section>
<section id="lesson" hidden><div class="lesson-heading"><div><p class="eyebrow">LEARNING </p><h1 id="lesson-title"></h1></div><p class="hint">残り時間内は自由に見返せます。</p></div><nav id="artist-nav" class="artist-nav" aria-label="画家を切り替える"></nav><div id="sections"></div></section>
<section id="finished" class="welcome" hidden><p class="eyebrow">SESSION COMPLETE</p><h1>学習時間が終了しました</h1><p>ここからは教材を参照せず、ご自身で回答してください。</p><p id="finish-id"></p><a id="posttest" class="button" hidden>Google フォームで事後テストに回答する</a><p id="no-posttest" class="notice" hidden>次のテストのリンクはまだ設定されていません。実施者にご連絡ください。</p></section></main>
<dialog id="lightbox"><button id="close-lightbox" class="secondary">閉じる</button><img id="large-image" alt=""><p id="large-caption"></p></dialog><footer>画風学習資料</footer></body></html>
